<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KokoroMemo Chat</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #1a1a2e; color:#e0e0e0; height:100vh; display:flex; }

/* 侧边栏 */
.sidebar { width:280px; min-width:280px; background:#16213e; display:flex; flex-direction:column; border-right:1px solid #0f3460; }
.sidebar-header { padding:20px; border-bottom:1px solid #0f3460; }
.sidebar-header h1 { font-size:18px; color:#e94560; }
.sidebar-header p { font-size:12px; color:#888; margin-top:4px; }
.sidebar-status { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px; color:#4ade80; }
.sidebar-status .dot { width:8px; height:8px; border-radius:50%; background:#4ade80; }

.char-list { flex:1; overflow-y:auto; padding:12px; }
.char-card { padding:12px; border-radius:8px; margin-bottom:8px; cursor:pointer; transition:.2s; border:1px solid transparent; }
.char-card:hover { background:#1a1a3e; }
.char-card.active { background:#1a1a4e; border-color:#e94560; }
.char-card .name { font-size:15px; font-weight:600; color:#fff; }
.char-card .desc { font-size:12px; color:#999; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.sidebar-footer { padding:12px; border-top:1px solid #0f3460; }
.btn { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-size:13px; transition:.2s; }
.btn-primary { background:#e94560; color:#fff; width:100%; }
.btn-primary:hover { background:#d63851; }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-ghost { background:transparent; color:#e94560; border:1px solid #e94560; }
.btn-ghost:hover { background:#e94560; color:#fff; }

/* 主区域 */
.main { flex:1; display:flex; flex-direction:column; }
.chat-header { padding:16px 24px; border-bottom:1px solid #0f3460; display:flex; align-items:center; justify-content:space-between; }
.chat-header .char-info h2 { font-size:18px; color:#fff; }
.chat-header .char-info p { font-size:12px; color:#888; }
.chat-header .char-actions { display:flex; gap:8px; }

.messages { flex:1; overflow-y:auto; padding:24px; }
.msg { margin-bottom:20px; display:flex; }
.msg.user { justify-content:flex-end; }
.msg .bubble { max-width:70%; padding:12px 16px; border-radius:12px; line-height:1.6; font-size:14px; white-space:pre-wrap; }
.msg.user .bubble { background:#e94560; color:#fff; border-bottom-right-radius:4px; }
.msg.assistant .bubble { background:#16213e; color:#e0e0e0; border-bottom-left-radius:4px; }
.msg .name-label { font-size:11px; color:#666; margin-bottom:4px; }
.msg.user .name-label { text-align:right; }

.input-area { padding:16px 24px; border-top:1px solid #0f3460; }
.input-row { display:flex; gap:12px; }
.input-row textarea { flex:1; padding:12px; border-radius:8px; border:1px solid #0f3460; background:#16213e; color:#e0e0e0; font-size:14px; resize:none; outline:none; font-family:inherit; }
.input-row textarea:focus { border-color:#e94560; }
.input-row button { padding:12px 24px; background:#e94560; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:14px; }
.input-row button:hover { background:#d63851; }
.input-row button:disabled { opacity:.5; cursor:not-allowed; }

/* 模态框 */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:#1a1a2e; border:1px solid #0f3460; border-radius:12px; width:520px; max-height:80vh; overflow-y:auto; padding:24px; }
.modal h2 { margin-bottom:16px; color:#fff; font-size:18px; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:13px; color:#999; margin-bottom:4px; }
.form-group input, .form-group textarea { width:100%; padding:10px; border-radius:6px; border:1px solid #0f3460; background:#16213e; color:#e0e0e0; font-size:14px; outline:none; font-family:inherit; }
.form-group textarea { min-height:60px; resize:vertical; }
.form-group input:focus, .form-group textarea:focus { border-color:#e94560; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }

.greeting-msg { text-align:center; color:#555; padding:40px 0; font-size:14px; }
.typing-dots::after { content: "..."; animation: dots 1.5s steps(4) infinite; }
@keyframes dots { 0%,20% { content: ""; } 40% { content: "."; } 60% { content: ".."; } 80%,100% { content: "..."; } }

.scroll-to-bottom { position:fixed; bottom:100px; right:30px; background:#16213e; border:1px solid #0f3460; border-radius:50%; width:40px; height:40px; display:none; align-items:center; justify-content:center; cursor:pointer; color:#fff; font-size:20px; z-index:10; }

</style>
</head>
<body>

<!-- 侧边栏 -->
<div class="sidebar">
  <div class="sidebar-header">
    <h1>KokoroMemo</h1>
    <p>AI 角色聊天</p>
    <div class="sidebar-status"><span class="dot" id="statusDot"></span><span id="statusText">连接中...</span>
      <span id="ttsBadge" style="display:none;margin-left:auto;font-size:10px;background:#1a3a1a;color:#4ade80;padding:1px 6px;border-radius:4px;">♫ TTS</span>
    </div>
  </div>
  <div class="char-list" id="charList"></div>
  <div class="sidebar-footer">
    <div style="margin-bottom:8px;display:flex;align-items:center;gap:6px;">
      <select id="modelSelect" style="flex:1;padding:6px 8px;border-radius:6px;border:1px solid #0f3460;background:#16213e;color:#e0e0e0;font-size:12px;outline:none;cursor:pointer;" onchange="switchModel(this.value)"></select>
    </div>
    <button class="btn btn-primary" onclick="showCreateModal()">+ 创建角色</button>
  </div>
</div>

<!-- 主区域 -->
<div class="main" id="mainArea">
  <div class="chat-header">
    <div class="char-info">
      <h2 id="chatTitle">选择一个角色开始对话</h2>
      <p id="chatDesc"></p>
    </div>
    <div class="char-actions">
      <button class="btn btn-sm btn-ghost" id="editBtn" onclick="showEditModal()" style="display:none">编辑设定</button>
    </div>
  </div>
  <div class="messages" id="messages">
    <div class="greeting-msg">← 左侧选择一个角色开始聊天</div>
  </div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="inputBox" rows="2" placeholder="输入消息..." disabled></textarea>
      <button id="sendBtn" disabled onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>

<!-- 角色编辑模态框 -->
<div class="modal-overlay" id="charModal">
  <div class="modal">
    <h2 id="modalTitle">创建角色</h2>
    <div class="form-group">
      <label>角色标识（英文，如 yuki）</label>
      <input id="fKey" placeholder="yuki" />
    </div>
    <div class="form-group">
      <label>角色名称</label>
      <input id="fName" placeholder="Yuki" />
    </div>
    <div class="form-group">
      <label>设定（一句话介绍）</label>
      <input id="fDesc" placeholder="一个温柔体贴的少女" />
    </div>
    <div class="form-group">
      <label>性格</label>
      <input id="fPersonality" placeholder="温柔、体贴、偶尔调皮" />
    </div>
    <div class="form-group">
      <label>背景故事</label>
      <textarea id="fBackground" placeholder="和玩家住在同一栋公寓的邻居"></textarea>
    </div>
    <div class="form-group">
      <label>初次见面打招呼用语</label>
      <input id="fGreeting" placeholder="你好呀！今天过得怎么样？" />
    </div>
    <div class="form-group">
      <label>对话示例</label>
      <textarea id="fExample" rows="3" placeholder="玩家：我回来了。&#10;Yuki：欢迎回来！"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveCharacter()">保存</button>
    </div>
  </div>
</div>

<!-- 滚动到底部按钮 -->
<div class="scroll-to-bottom" id="scrollBtn" onclick="scrollToBottom()">↓</div>

<script>
let characters = {};
let currentKey = null;
let isStreaming = false;
let editingKey = null;
let currentModel = "qwen2.5:0.5b";

// ======== 初始化 ========
async function init() {
    try {
        await Promise.all([loadCharacters(), loadModels()]);
        setupInput();
    } catch(e) {
        console.error("初始化失败:", e);
        document.getElementById("charList").innerHTML = "<div style='color:#e94560;padding:12px;font-size:13px;'>加载失败，请刷新页面</div>";
    }
}

async function loadModels() {
    try {
        const r = await fetch("/api/models");
        return;
        currentModel = d.current;
        const sel = document.getElementById("modelSelect");
        sel.innerHTML = d.available.map(m =>
            `<option value="${m}" ${m === d.current ? "selected" : ""}>${m}</option>`
        ).join("");
    } catch(e) {
        console.warn("加载模型列表失败:", e);
    }
}

async function switchModel(model) {
    try {
        const r = await fetch("/api/models/switch", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({model})
        });
        const d = await r.json();
        if (d.status === "ok") {
            currentModel = d.current;
        }
    } catch(e) {
        console.error("切换模型失败:", e);
    }
}

async function checkTTS() {
    try {
        return;
        const d = await r.json();
        if (false) {
            const badge = document.getElementById("ttsBadge");
            badge.style.display = "inline-block";
            badge.textContent = "♫ " + (d.engine || "TTS");
        }
    } catch(e) {}
}

async function loadCharacters() {
    const r = await fetch("/api/characters");
    if (!r.ok) throw new Error("HTTP " + r.status);
    characters = await r.json();
    renderCharList();
    const keys = Object.keys(characters);
    if (currentKey && characters[currentKey]) {
        selectCharacter(currentKey);
    } else if (keys.length > 0) {
        selectCharacter(keys[0]);
    }
}

function renderCharList() {
    const el = document.getElementById("charList");
    el.innerHTML = Object.entries(characters).map(([k, c]) =>
        `<div class="char-card ${k === currentKey ? 'active' : ''}" onclick="selectCharacter('${k}')">
            <div class="name">${esc(c.name)}</div>
            <div class="desc">${esc(c.description || '')}</div>
        </div>`
    ).join("");
}

function selectCharacter(key) {
    currentKey = key;
    const c = characters[key];
    if (!c) return;
    renderCharList();
    document.getElementById("chatTitle").textContent = c.name;
    document.getElementById("chatDesc").textContent = c.description || "";
    document.getElementById("editBtn").style.display = "inline-block";
    document.getElementById("messages").innerHTML = "";
    document.getElementById("inputBox").disabled = false;
    document.getElementById("sendBtn").disabled = false;
    document.getElementById("inputBox").focus();

    if (c.greeting) {
        addMessage("assistant", c.greeting, c.name);
    }

    // 重置会话
    messageHistory = [{ role: "system", content: buildSystemPrompt(c) }];
    scrollToBottom();
}

function buildSystemPrompt(c) {
    let p = `你是 ${c.name}。\n\n【设定】${c.description}\n【性格】${c.personality}\n【背景】${c.background}`;
    if (c.relationship) p += `\n【关系】${c.relationship}`;
    if (c.example_dialogue) p += `\n\n【对话示例】\n${c.example_dialogue}`;
    p += `\n\n请以 ${c.name} 的身份与我对话，用自然亲切的语气，不要提及你是AI或语言模型。`;
    p += `\n\n【要求】只说对话本身，不要任何动作描写、表情描写或场景描写。回复简短自然，每次1-3句话。`;
    p += `\n\n【重要】不要刻意展示你的身份设定或背景故事，像普通人一样正常对话。`;
    return p;
}

let messageHistory = [];

function addMessage(role, content, name) {
    const el = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${role}`;

    if (role === "assistant" && name) {
        div.innerHTML = `<div class="bubble"><div class="name-label">${esc(name)}</div>${content}</div>`;
    } else {
        div.innerHTML = `<div class="bubble">${content}</div>`;
    }
    el.appendChild(div);
    return div;
}

function updateLastMessage(content) {
    const el = document.getElementById("messages");
    const last = el.lastElementChild;
    if (last && last.classList.contains("assistant")) {
        const bubble = last.querySelector(".bubble");
        const nameLabel = bubble.querySelector(".name-label");
        let newHtml = nameLabel ? nameLabel.outerHTML : "";
        newHtml += content;
        bubble.innerHTML = newHtml;
    }
    scrollToBottom();
}

// ======== 发送消息 ========
async function sendMessage() {
    if (isStreaming || !currentKey) return;
    const input = document.getElementById("inputBox");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";

    addMessage("user", esc(text));
    messageHistory.push({ role: "user", content: text });

    isStreaming = true;
    document.getElementById("sendBtn").disabled = true;

    const c = characters[currentKey];
    addMessage("assistant", '<span class="typing-dots"></span>', c.name);

    try {
        const resp = await fetch("/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: currentModel,
                messages: messageHistory,
                character_id: currentKey,
                stream: true
            })
        });

        if (!resp.ok) {
            updateLastMessage(`[错误] ${resp.status}`);
            return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let reply = "";
        let reasoningText = "";
        let buffer = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";
            for (const line of lines) {
                if (!line.startsWith("data: ") || line === "data: [DONE]") continue;
                try {
                    const chunk = JSON.parse(line.slice(6));
                    const delta = chunk.choices?.[0]?.delta || {};
                    const content = delta.content || "";
                    const reasoning = delta.reasoning_content || "";
                    if (content) {
                        reply += content;
                        updateLastMessage(esc(reply));
                    } else if (reasoning) {
                        reasoningText += reasoning;
                        updateLastMessage(`<span style="color:#888;font-style:italic">${esc(reasoningText)}</span>`);
                    }
                } catch(e) {}
            }
        }
        if (reply) {
            messageHistory.push({ role: "assistant", content: reply });
        }
    } catch(e) {
        updateLastMessage(`[连接失败] ${e.message}`);
    } finally {
        isStreaming = false;
        document.getElementById("sendBtn").disabled = false;
        document.getElementById("inputBox").focus();
    }
}

// ======== 角色管理 ========
function showModal() {
    const el = document.getElementById("charModal");
    el.style.display = "flex";
}

function hideModal() {
    const el = document.getElementById("charModal");
    el.style.display = "none";
}

function showCreateModal() {
    editingKey = null;
    try {
        document.getElementById("modalTitle").textContent = "创建角色";
        ["fKey","fName","fDesc","fPersonality","fBackground","fGreeting","fExample"].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.value = "";
        });
        const fk = document.getElementById("fKey");
        if (fk) fk.disabled = false;
    } catch(e) { console.warn("表单填充错误:", e); }
    showModal();
}

function showEditModal() {
    if (!currentKey) return;
    editingKey = currentKey;
    try {
        const c = characters[currentKey];
        document.getElementById("modalTitle").textContent = "编辑角色";
        document.getElementById("fKey").value = currentKey;
        document.getElementById("fKey").disabled = true;
        document.getElementById("fName").value = c.name || "";
        document.getElementById("fDesc").value = c.description || "";
        document.getElementById("fPersonality").value = c.personality || "";
        document.getElementById("fBackground").value = c.background || "";
        document.getElementById("fGreeting").value = c.greeting || "";
        document.getElementById("fExample").value = c.example_dialogue || "";
    } catch(e) { console.warn("表单填充错误:", e); }
    showModal();
}

function closeModal() {
    hideModal();
}

async function saveCharacter() {
    const key = document.getElementById("fKey").value.trim();
    if (!key) { alert("请输入角色标识"); return; }
    const data = {
        name: document.getElementById("fName").value.trim() || key,
        description: document.getElementById("fDesc").value.trim(),
        personality: document.getElementById("fPersonality").value.trim(),
        background: document.getElementById("fBackground").value.trim(),
        greeting: document.getElementById("fGreeting").value.trim(),
        example_dialogue: document.getElementById("fExample").value.trim(),
    };

    try {
        if (editingKey) {
            await fetch(`/api/characters/${editingKey}`, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            });
        } else {
            const r = await fetch(`/api/characters/${key}`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            });
            if (!r.ok) { const e = await r.json(); alert(e.detail); return; }
        }
        closeModal();
        await loadCharacters();
    } catch(e) {
        alert("保存失败: " + e.message);
    }
}

// ======== 工具 ========
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function scrollToBottom() {
    const el = document.getElementById("messages");
    el.scrollTop = el.scrollHeight;
}

function setupInput() {
    const ta = document.getElementById("inputBox");
    ta.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    ta.addEventListener("input", () => {
        ta.style.height = "auto";
        ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    });

    // 滚动到底部按钮
    const msgs = document.getElementById("messages");
    msgs.addEventListener("scroll", () => {
        const btn = document.getElementById("scrollBtn");
        const threshold = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight > 100;
        btn.style.display = threshold ? "flex" : "none";
    });
}

init();
</script>
</body>
</html>
