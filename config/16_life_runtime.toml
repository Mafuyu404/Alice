# ===========================================================================
# AI life runtime skeleton
# ===========================================================================
# This is the new prompt-engineering-oriented runtime described in
# doc/life_runtime_redesign.md.
#
# The program is only the skeleton: event pooling, context compaction,
# patch application, tool execution, logs, timeout and recovery. LLM prompts
# decide rhythm, attention, thinking intensity, and tool plans.

[life_runtime]
# LifeRuntime is the primary inner-stream/action runtime. Inputs publish events;
# the inner stream decides when to call tools.
enabled = true

# When true, LifeRuntime owns autonomous inner-stream/action cycling and the
# old InnerStreamLoop/AutonomousStep is not started for the session.
primary = true

# Max events retained in the high-throughput information pool.
pool_max_events = 512

# Max events sent to one high-frequency thinking tick.
batch_max_events = 32

# Max event text chars sent to one thinking tick.
batch_max_chars = 4000

# Max compressed context chars retained per character.
context_max_chars = 8000

# Max completion tokens for one life tick.
tick_max_tokens = 640

# Direct foreground interaction should be quick. These only narrow the prompt
# budget for high-priority live inputs; normal autonomous thinking keeps the
# wider context above.
foreground_tick_max_tokens = 420
foreground_context_fragment_max_chars = 2200
foreground_event_batch_fragment_max_chars = 1800

# Idle thoughts should keep life moving without occupying the foreground path
# with a long generation.
idle_tick_max_tokens = 360
idle_context_fragment_max_chars = 2200
idle_event_batch_fragment_max_chars = 800

# Max completion tokens when patch-first fails and asks for a full rewrite.
fallback_max_tokens = 640

# Tool execution feedback merge window.
result_merge_window_seconds = 1.0

# Default tool timeout passed to ToolSpec execution context.
tool_timeout = 45.0

# Background loop interval before the LLM has chosen a thinking_intensity.
idle_tick_seconds = 2.0

# Runtime maps LLM-chosen thinking_intensity onto this interval range.
min_tick_seconds = 0.25
max_tick_seconds = 8.0

# Memory maintenance is part of the life core, but it must not block live
# thought and direct conversation. The runtime appends memory events on the
# foreground path and wakes the memory lifecycle worker; consolidation runs
# outside the life loop thread.
memory_core_inline = false
memory_core_wake_seconds = 20.0

# Tool selection sees a compact capability catalog. Tool-specific prepare and
# after prompts still own detailed behavior.
tool_select_capability_max_chars = 2600
tool_schema_description_max_chars = 120

[life_runtime.local_thinking]
# Core life thinking and auxiliary prompt/tool processing use separate models.
enabled = true
primary_model = "deepseek-v4-flash"
auxiliary_model = "qwen2.5:7b"

# auto tries Ollama first, then OpenAI-compatible on 404. Use "ollama" or
# "openai" to force a protocol.
api_style = "auto"

# Empty means llm_url from 03_llm.toml. For local_llm.py use
# "http://127.0.0.1:14515/v1" and api_style = "openai".
base_url = ""
temperature = 0.4
timeout = 20

[life_runtime.debug_cli]
# Defaults for `python cli.py --life-debug --character lerwa`.
# Keep operational choices here instead of repeating long command-line flags.
real_llm = true
real_memory = true
debug_run = true
qq = true
duration_seconds = 1200.0
ticks = 3
out_dir = ""
debug_run_dir = ""
initial_event = "正常调试验收开始。"

# Empty values reuse [life_runtime.local_thinking].
llm_model = ""
llm_url = ""
api_style = ""
