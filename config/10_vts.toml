# ===========================================================================
# VTube Studio / Live2D
# ===========================================================================

[vts]
# 是否启用 VTube Studio 连接。
# 类型: bool
enabled = true

# VTube Studio Public API 地址。
host = "localhost"
port = 8001

[vts.body]
# 是否启用由内在状态驱动的 Live2D 脸部/身体脚本。
# 类型: bool
enabled = true

# 参数注入刷新率。越高动作越顺，通常 20-30 足够。
# 类型: float
update_hz = 30.0

# LLM 生成下一段身体表达脚本的最小间隔。
# 类型: float
intent_interval_seconds = 2.0

# 没有新表达脚本时，多久主动生成一次待机脚本。
# 类型: float
idle_request_seconds = 2.5

# 身体脚本生成模型。留空使用默认 LLM。
# 类型: string
model = "qwen2.5:1.5b"

# 是否记录 [vts_body] 脚本日志。
# 类型: bool
debug_log = true
