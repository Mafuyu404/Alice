# ===========================================================================
# 字幕覆盖层 — 流式显示 LLM 输出
# ===========================================================================
# 由 overlay_subtitle.py 实现。独立窗口，透明背景，白描深红字体，
# 可拖拽/缩放/折叠。开关与立绘绑定。

[subtitle]
# 字体颜色（CSS 颜色值）。
# 类型: string
# 例如 "#8b0000"（深红）、"#ffffff"（白色）、"#ff4444"（红色）
font_color = "#8b0000"

# 字体描边颜色（CSS 颜色值）。
# 类型: string
# 描边围绕字体边缘一圈，使文字更清晰易读。
stroke_color = "#ffffff"

# 字号（像素）。
# 类型: int
# 推荐范围: 18 ~ 48。
font_size = 30

# HTTP 控制服务地址和端口（与立绘独立）。
# 类型: string / int
# 确保端口不被其他程序占用。
subtitle_host = "127.0.0.1"
subtitle_port = 17353

# STT 字幕单独配置（独立端口，深蓝色描边）。
# 与 chat 字幕共用同一窗口程序，不同端口实现多实例。
[subtitle_stt]
# 字体颜色（CSS 颜色值）。
font_color = "#00008b"

# 字体描边颜色。
stroke_color = "#ffffff"

# 字号（像素）。
font_size = 30

# 折叠按钮颜色。
btn_color = "#4444ff"

# HTTP 控制服务端口（与 chat 字幕不同端口）。
subtitle_host = "127.0.0.1"
subtitle_port = 17354
