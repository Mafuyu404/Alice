# ===========================================================================
# 内在叙事流 — 自我表达连续性
# ===========================================================================
# 由 LLM 维护一段自然语言内在连续性，用于让角色在对话中保留自己的
# 注意、判断、表达惯性和话题耐心。程序只读写和注入文本，不解析为规则。

[inner_stream]
# 是否启用内在叙事流。
# 类型: bool
enabled = true

# 每次启动时是否清空上一轮运行保存的内在叙事流。
# 这样长期记忆和认知仍保留，但不会把几天前的临时注意力当成当前状态。
# 类型: bool
reset_on_start = true

# 更新内在叙事流使用的模型。留空则使用 llm_model。
# 类型: string
model = ""

# 保存并注入的最大字符数。
# 类型: int
max_chars = 1200

# 单次更新最大生成 token。
# 类型: int
max_tokens = 420

# 内在叙事流更新日志。用于观察每次思考的触发、输入和更新结果。
# 类型: bool
log_updates = true

# 外部/自身事件进入后，最早提前到多少秒后更新内在叙事流。
# 类型: float
event_wakeup_delay_seconds = 0.8

# 没有强输入时，内在叙事流自己的基础更新周期。
# 类型: float
idle_interval_seconds = 8.0

# 长时间没有事件时，注入低频 time_tick 的周期。0 表示禁用。
# 类型: float
time_tick_interval_seconds = 8.0

# 单次节奏更新最多合并的事件数。
# 类型: int
event_max_batch = 16

# 注入内在叙事流 prompt 的事件文本最大字符数。
# 类型: int
event_prompt_max_chars = 3200

# 高频心跳更新时注入内在叙事流 prompt 的事件文本最大字符数。
# 类型: int
tick_prompt_max_chars = 1200

# ===========================================================================
# 内在叙事流主动搜索
# ===========================================================================
# 内在叙事流更新后，由 LLM 判断角色是否自然地产生了搜索冲动。
# 搜索结果会作为外部信息输入反馈回内在叙事流。

[inner_stream_search]
# 是否启用内在叙事流主动搜索。
# 类型: bool
enabled = true

# open-webSearch 本地 daemon 地址。
# 类型: string
base_url = "http://127.0.0.1:58902"

# 搜索冲动判断使用的模型。留空则使用 llm_model。
# 类型: string
model = ""

# 单次搜索返回结果数。
# 类型: int
max_results = 5

# 搜索事件写回内在叙事流的最大字符数。
# 类型: int
max_event_chars = 6000

# 搜索冲动判断的最小间隔。避免高频心跳每次都重复问搜索。
# 类型: float
consider_interval_seconds = 5.0

# daemon 请求超时。
# 类型: float
timeout = 45.0

# ===========================================================================
# 统一自主行动决策
# ===========================================================================
# 由同一个 AI 决策点在 inner_stream、QQ 现场、记忆、认知和可用能力之间
# 选择下一步行动。搜索、QQ 发言、记忆和认知更新都应尽量走这里，避免
# 多套局部自主系统同时抢决策权。

[autonomous_step]
# 是否启用统一自主行动决策。
# 类型: bool
enabled = true

# 使用的模型。留空则使用 dialogue_model/llm_model。
# 类型: string
model = ""

# 单次决策最大生成 token。
# 类型: int
max_tokens = 512

# 两次统一自主决策的最小间隔。
# 类型: float
min_interval_seconds = 3.0

# ===========================================================================
# 内在叙事流记忆反思
# ===========================================================================
# 内在叙事流更新后，由 LLM 判断最近输入/自身行动是否形成了值得记住的
# 一整件经历。记忆以自然语言事件写入，不做人工索引。

[inner_memory]
# 是否启用内在叙事流参与的记忆沉淀。
# 类型: bool
enabled = true

# 记忆反思使用的模型。留空则使用 llm_model。
# 类型: string
model = ""

# 单次反思最大生成 token。
# 类型: int
max_tokens = 512

# 记忆反思的最小间隔。高频心跳不应每次都触发重型记忆判断。
# 类型: float
consider_interval_seconds = 30.0

# 至少有多少个真实输入/自身行动事件时才触发记忆反思。
# 类型: int
min_events = 2

# ===========================================================================
# 内在叙事流认知反思
# ===========================================================================
# 内在叙事流更新后，把 QQ 群友、关系、长期对象等稳定印象沉淀到
# cognition.json。它不记录流水账，只维护可复用的长期认知。

[inner_cognition]
# 是否启用内在叙事流参与的认知沉淀。
# 类型: bool
enabled = true

# 认知反思最小间隔。避免每次心跳都触发 cognition 全量评估。
# 类型: float
consider_interval_seconds = 45.0

# 至少有多少个 QQ/搜索/图片/自身行动事件时才触发。
# 类型: int
min_events = 1

# 送入 cognition 评估的最近事件最大字符数。
# 类型: int
max_event_chars = 5000
