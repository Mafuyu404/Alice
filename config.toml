# Alice Chat 框架配置文件
# 真实的 API 密钥不要提交到 git。空密钥会禁用对应的云功能。
#
# 本文件所有可配置项均已列出。注释中标注了类型、取值范围、效果说明。
# config.toml 的值优先级高于 config.json。config.json 只填充本文件中为空/缺失的项。

# ===========================================================================
# 用户身份
# ===========================================================================

# 当前与 AI 对话的用户名称。AI 会用这个名字称呼、记忆对方。
# 更换名字后，所有认知条目和长期记忆将以新名字重新索引和建立，
# 旧名字的认知条目会随对话过程逐渐被覆盖替换。
# 类型: string
user_name = "真冬"

# ===========================================================================
# 场景开关 — 决定 LLM 的信息输入源布局
# ===========================================================================

# 场景由多个独立开关组合，不再用 single_live/multi_live 这类混合枚举。
# multi_enabled 控制是否按多人场景理解说话人。
# live_enabled 控制是否按直播场景理解弹幕/观众输入。
# random_mc_enabled 控制是否按“随机 MC 百科页面”理解当前网页。
# 多个开关可以组合；例如多人 + 随机 MC 表示多个角色一起讨论当前随机页面。
[scene]
multi_enabled = false
live_enabled = false
random_mc_enabled = true

# ===========================================================================
# 对话调度器 — LLM 决定当前是否说话
# ===========================================================================
# 对话调度器会在单人对话中先让 LLM planner 判断角色应当沉默、轻回应、
# 正常发言，还是延迟到之后再说。planner 会读取角色设定，因此不同人格
# 可以自然表现出不同的话轮倾向。
[dialogue]
# 是否启用统一对话调度器。
# 类型: bool
enabled = true

# 对话调度 planner 模型。留空则复用 proactive.planning_model 或默认 LLM 模型。
# 类型: string
planning_model = ""

# 是否打印 planner 决策，便于观察角色什么时候选择沉默或轻回应。
# 类型: bool
log_decisions = true

# planner 可见的最近消息数。
# 类型: int
max_recent_messages = 10

# planner 可见的角色 system prompt 最大字符数。角色卡本身会完整摘要注入，
# 这里主要保留核心规则，降低成本并减少无关旧上下文跑偏。
# 类型: int
max_character_prompt_chars = 900

# planner 可见的角色卡单字段最大字符数。
# 类型: int
max_profile_field_chars = 420

# schedule 动作允许的最大延迟秒数。
# 类型: float
max_delay_seconds = 120.0

# 空闲时检查屏幕/网页缓存并交给对话调度器判断是否值得主动提及的间隔。
# 只读缓存，不触发截图或网页抓取。
# 类型: float
idle_context_interval_seconds = 30.0

# 空闲上下文规划时，屏幕兴趣度至少达到多少才作为候选材料给 planner。
# 类型: float
context_idle_min_score = 70.0

# 决策选择 context_use=screen/page 后，注入生成器的最大缓存字符数。
# 类型: int
screen_context_max_chars = 1200
page_context_max_chars = 2500

# ===========================================================================
# 多角色对话调度器 — 用户 + 多个独立角色
# ===========================================================================
# 多角色调度器用于 text_cli.py --multi。它使用第三人称 planner 判断
# 下一个该由谁说话、是否沉默、是否短回应或稍后再说；被选中的角色再用
# 自己的 ChatSession、记忆、认知和情绪生成台词。
[multi_dialogue]
# 多角色 planner 模型。留空则复用 dialogue.planning_model、
# proactive.planning_model 或默认 LLM 模型。
# 类型: string
planning_model = ""

# schedule 动作允许的最大延迟秒数。
# 类型: float
max_delay_seconds = 120.0

# 每次用户输入后允许的 AI-AI 自动续接次数。0 表示用户说完后通常最多
# 一个角色回应；需要观察角色互相接话时可调为 1。
# 类型: int
max_auto_followups = 1

# 是否打印多角色 planner 决策。
# 类型: bool
log_decisions = true

# 决策选择 context_use=screen/page 后，注入生成器的最大缓存字符数。
# 类型: int
screen_context_max_chars = 1200
page_context_max_chars = 2500

# 空闲上下文规划时，屏幕兴趣度至少达到多少才作为候选材料给 planner。
# 类型: float
context_idle_min_score = 70.0

# ===========================================================================
# LLM 路由
# ===========================================================================

# LLM 服务地址（兼容 OpenAI / Ollama 格式）。
# 类型: string (URL)
# Ollama 默认: http://127.0.0.1:11434
# OpenAI 兼容服务: http://127.0.0.1:8000/v1（程序会自动补 /v1）
# DeepSeek 等云端 API 不需要在此填地址，由模型名自动路由。
llm_url = "http://127.0.0.1:11434"

# 默认对话模型名称。
# 类型: string（模型名）
# 使用 Ollama: "qwen2.5:7b", "deepseek-v4-flash" 等
# 使用 OpenAI 兼容服务: 按服务支持的模型名填写
# 使用 DeepSeek: 模型名以 "deepseek" 开头时自动走 DeepSeek API
# 可通过启动参数 --model 临时覆盖。
llm_model = "deepseek-v4-flash"

# 主对话生成模型。
# 类型: string（模型名）
# 留空时复用 llm_model；若角色卡里填写 llm_model，启动参数 --model 仍优先覆盖。
dialogue_model = "deepseek-v4-flash"

# DeepSeek API 密钥。模型名以 deepseek 开头时自动使用 DeepSeek 云端 API。
# 也可以通过环境变量 DEEPSEEK_API_KEY 设置（环境变量优先级更高）。
# 留空时从 config.json 的 deepseek_api_key 读取。
# 类型: string
deepseek_api_key = ""

# 智谱 CharGLM API 密钥。使用 charglm 模型时需要。
# 留空时从 config.json 的 charglm_api_key 读取。
# 类型: string
charglm_api_key = ""

# 本地 transformers 模型名，作为 LLM 不可用时的后备。
# 仅在 local_llm.py 中使用，直接加载 HuggingFace 模型到内存。
# 类型: string（HuggingFace 模型 ID）
local_model = "Qwen/Qwen2.5-1.5B-Instruct"

# ===========================================================================
# TTS — 文本转语音
# ===========================================================================

# TTS 后端选择。
# 类型: string
# 可选值: "minimax"（推荐，低延迟流式）, "cartesia"
# 切换后端后会自动加载 kokoro/tts_{后端名}.py。
tts_backend = "minimax"

# TTS 播放音量倍率。
# 类型: float
# 1.0 = 原始音量，0.5 = 一半音量，0 = 静音，最大 2.0。
# 超过 1.0 可能产生削波失真，建议优先使用 0.3 ~ 1.0。
tts_volume = 1.25

# ── Cartesia 配置 ──
# Cartesia 海外 TTS 服务。需要海外网络访问和有效 API Key。
cartesia_api_key = ""
# Cartesia 语音 ID。可在 Cartesia 控制台获取。
tts_voice_id = ""
# Cartesia TTS 音频采样率（Hz）。
# 类型: int（可选 8000, 16000, 22050, 24000, 44100, 48000）
# 越高音质越好，但数据量也越大。建议 24000。
tts_sample_rate = 24000

# ── MiniMax 配置 ──
# MiniMax TTS 服务。国内可用，WebSocket 流式合成，延迟低。
minimax_api_key = ""
# MiniMax 语音模型名。
# 类型: string
# 可选: "speech-2.8-turbo"（推荐，快速）, "speech-2.8-pro"（高质量）
minimax_model = "speech-2.8-turbo"
# MiniMax TTS 音频采样率（Hz）。
# 类型: int，可选 8000/16000/22050/24000/32000/44100/48000
minimax_sample_rate = 32000
# 语速倍率。
# 类型: float
# 1.0 = 正常语速，>1 加快（最大约 2.0），<1 减慢（最小约 0.5）。
# 推荐范围: 0.9 ~ 1.2。
minimax_tts_speed = 1.1
# 播放前预缓冲的音频秒数。
# 类型: float
# 值越大播放越流畅（减少卡顿），但首音延迟越高。
# 敏感场景（需要快速响应）设 0.05 ~ 0.15，流畅优先设 0.3 ~ 0.5。
minimax_tts_buffer_seconds = 0.3
# 播放线程写入声卡前聚合的小音频块时长。
# 类型: float
# 值过小可能出现逐字卡顿；值过大增加播放延迟。推荐 0.06 ~ 0.12。
minimax_tts_write_buffer_seconds = 0.08
# LLM 流式输出累积多少字符后强制刷新 TTS 缓冲区。
# 类型: int
# 较小值让 TTS 更快开始说话（但可能断句不自然），较大值等待更完整句子。
# 推荐范围: 20 ~ 40。
tts_stream_chunk_chars = 28
# TTS 流式输出时，触发句子刷新的最小字符数（需配合句末标点）。
# 类型: int
# 低于此长度的句子即使有句末标点也不刷新，避免吐出过短的碎片。
# 推荐范围: 6 ~ 12。
tts_stream_sentence_min_chars = 8

# ===========================================================================
# AEC — 声学回声消除
# ===========================================================================
# 通过 WebRTC AEC 算法消除 TTS 扬声器输出被麦克风拾取造成的回声/啸叫。
# 使用 aec-audio-processing 库，基于 WebRTC AudioProcessing 模块。
#
# 启用后，STT 输入会与 TTS 播放的参考信号做相关性抵消，
# 从而在麦克风音频中去除扬声器发出的声音。这样即使不戴耳机也不会产生
# 回声反馈循环，同时 STT 在 TTS 播放期间也不需要暂停。
#
# 如果开启后回声仍未消除，请尝试调整 delay_ms 参数。

[aec]
# 是否启用回声消除。
# 类型: bool (true/false)
# true: STT 和 TTS 可同时运行，外放无回声
# false: 使用传统方式（戴耳机或 stt_pause_during_tts）
enabled = true

# 麦克风采集到扬声器播放之间的预估延迟（毫秒）。
# 类型: int
# 包括音频缓冲区延迟 + 空气传播延迟。
# 值越大，AEC 使用越"旧"的参考信号做抵消。
# 一般桌面场景 60 ~ 110ms。外放防回灌建议从 85 开始调试。
# 如果回声听起来像"重叠/双份"，说明延迟偏大。
# 如果回声残留明显，说明延迟偏小或声道延迟不稳定。
delay_ms = 85

# 噪声抑制等级（0 ~ 4）。
# 类型: int
# 0 = 关闭（仅回声消除）
# 1 = 轻度
# 2 = 中等（耳机或轻度外放）
# 3 = 激进（推荐外放防回灌）
# 4 = 非常激进（适合麦克风底噪大的场景）
ns_level = 3

# TTS 完成后重置 AEC 自适应滤波状态。
# 类型: bool (true/false)
# true: 避免多轮播放后滤波器漂移导致偶发回灌（推荐）
# false: 保留连续自适应状态，适合稳定固定设备链路
auto_reset_on_tts_done = true


# ===========================================================================
# STT — 语音转文字
# ===========================================================================

[stt]

# 是否启用麦克风 STT 输入。
# 类型: bool (true/false)
# false: 主动闭麦，不加载 STT 模型，不打开麦克风；QQ、内在叙事流和其他输入继续运行。
enabled = false

# 流式 ASR 模型的存放目录。
# 类型: string（目录路径）
# 程序首次运行会自动下载模型到此目录。
stt_model_dir = "models/stt"

# 用于精炼 STT 原始识别结果的小模型。
# 类型: string（模型名）
# STT 输出碎片化短文本，此模型负责修正同音错字和去除口吃重复。
# 模型越强精炼效果越好，但延迟也越高。建议 1.5b ~ 7b。
# 设为 "" 可跳过精炼（直接使用原始 STT 结果）。
stt_refine_model = "qwen2.5:1.5b"

# 认知层评估用模型。留空则使用 llm_model。
# 类型: string（模型名）
# 用于上下文总结时对认知层（cognition.json）的全量评估。
# 建议用小模型（如 qwen2.5:1.5b）控制成本。
cognition_model = ""

# 认知层评估频率。每 N 轮对话评估一次。
# 类型: int
# 设为 0 禁用周期性评估（仅保留摘要时的评估）。
# 推荐范围: 3 ~ 10。
cognition_eval_interval = 5

# 情绪层评估用模型。留空则使用 llm_model。
# 类型: string（模型名）
# 当前对话 prompt 不再直接注入 emotion；情绪/短期动机由 inner_stream 吸收。
# 此配置主要保留给 VTS/表情等外部兼容路径。
emotion_model = ""

# STT 精炼模式。
# 类型: string
# 可选值:
#   "separate" - 独立精炼 LLM 调用（默认，当前行为），精炼完再聊天
#   "inline"   - 本地正则预清洗 + 聊天 LLM 隐式纠错，一次调用完成
#   "none"     - 仅本地正则预清洗，不调用任何 LLM 精炼
# separate 质量最高但延迟最大（精炼 LLM 串行阻塞）。
# inline 延迟最低，聊天 LLM 在回复时自然纠正少量同音错字。
# none 零 LLM 开销，适合 STT 准确率已经很高的场景。
stt_refine_mode = "inline"

# STT 文本稳定判定间隔（秒）。
# 类型: float
# 收到最后一段 STT 片段的静默时长超过此值后，触发精炼和推送。
# 太短：用户话没说完就推送，对话不完整。
# 太长：响应迟钝，需要等待更久。
# 根据用户说话习惯调整。一般 0.8 ~ 2.0 秒。
stt_refine_stable_seconds = 0.6

# STT 端点候选提交等待（秒）。
# 类型: float
# 识别到静音端点后不会立刻提交，而是等待一个短窗口。
# 如果用户继续说话，会合并为同一句，避免”我给你 / 我说 / 给你安装”被拆成多轮。
# 注意: 此值 + stt_refine_stable_seconds 构成端点检测的总等待。
#       stt_turn_merge_seconds 是 CLI 层额外的小合并窗口。
stt_utterance_commit_seconds = 0.15

# 短句额外等待时间（秒）。
# 类型: float
# 短片段更可能是半句话，提交前额外等待，提升自然对话稳定性。
stt_short_utterance_extra_seconds = 0.5

# 触发短句额外等待的最大字符数。
# 类型: int
stt_short_utterance_max_chars = 8

# 用户轮次合并窗口（秒）。
# 类型: float
# ConversationManager 端点检测完成并 dispatch 后，CLI 层保留一个短窗口
# 以便合并紧急打断等场景下连续到达的短片段。
# 减小此值可减少从说话结束到 AI 响应的延迟。
# 设为 0.0 则 ConversationManager 检测完毕后立即 dispatch。
stt_turn_merge_seconds = 0.0

# 是否启用 Dialogue 统一处理 STT 池。
# 类型: bool (true/false)
# true: STT 只累积文本；明显停顿后由 Dialogue LLM 一次决定 wait/speak、提炼用户内容并生成回复。
# false: 使用旧路径，合并窗口结束后直接把文本作为用户输入交给 dialogue。
stt_dialogue_pool_enabled = false

# 重叠（同时说话）分类模型。
# 类型: string（Ollama 模型名）
# 用户插话时，用此模型判断AI应继续说话、软打断还是硬打断。
# 推荐 qwen2.5:0.5b 等小模型，延迟是关键。
overlap_model = "qwen2.5:0.5b"

# 对话池轮询间隔（秒）。
# 类型: float
# 后台线程检查是否有稳定文本的频率。越小越及时，但 CPU 开销略高。
# 建议保持 0.05（50ms），不需要改动。
stt_pool_tick_seconds = 0.05

# STT 精炼 LLM 调用的最大 token 数。
# 类型: int
# 限制精炼模型的输出长度，防止胡言乱语消耗过多算力。
# STT 原文通常很短，64 ~ 128 足够。
stt_refine_max_tokens = 128

# 是否跳过短文本的精炼。
# 类型: bool (true/false)
# true: 短文本（长度 ≤ stt_skip_short_refine_max_chars）且无明显 ASR 异常时不调 LLM 精炼。
# false: 所有文本都走精炼。
# 开启可减少 LLM 调用次数和延迟，适合短文本较多的场景。
stt_skip_short_refine = true

# 跳过精炼的最大字符数（仅 stt_skip_short_refine = true 时生效）。
# 类型: int
# 超过此长度的文本即使无异常也会走 LLM 精炼。
stt_skip_short_refine_max_chars = 18

# TTS 播放期间暂停麦克风输入。
# 类型: bool (true/false)
# true: TTS 播放时关闭麦克风输入，防止扬声器声音被麦克风捕获造成回声/混乱。
# false: 不暂停，TTS 和 STT 同时运行（需要物理回声消除或用下方的 [aec] 配置）。
# 注：若 [aec].enabled = true，此配置无效（由 AEC 替代）。
stt_pause_during_tts = false

  # TTS 回声文本过滤窗口（秒）。AEC 漏掉的外放回声会在 STT 提交前用最近 TTS 文本兜底过滤。
  # 类型: float
  stt_echo_filter_seconds = 45.0

  # TTS 回声文本过滤的最短字符数。太短的片段容易误杀正常短回应。
  # 类型: int
  stt_echo_filter_min_chars = 3

  # TTS 回声文本过滤相似度阈值。越低越激进，越高越保守。
  # 类型: float
  stt_echo_filter_similarity = 0.68

  # ===========================================================================
  # 记忆后端
# ===========================================================================

# 记忆后端类型。
# 类型: string
# 可选值:
#   "none"        - 禁用记忆功能
#   "mem0"        - 本地向量记忆库（当前推荐使用 mem0 + Ollama embedding + 本地 Qdrant）
#   "kokoromemo"  - 外部 KokoroMemo 记忆服务（需要单独启动 kokoromemo 服务）
memory_backend = "mem0"

# KokoroMemo 外部记忆服务地址和仓库路径。
# 仅 memory_backend = "kokoromemo" 时需要。
kokoromo_url = "http://127.0.0.1:14514"
kokoromo_dir = "D:/program/kokoromemo"

# ===========================================================================
# 记忆事件系统 — LLM 驱动的结构化记忆提取与总结
# ===========================================================================
# 代替原始对话存储，每轮对话由 LLM 提取为结构化事件（desc + tags），
# 在缓存中积累，定期总结合并后再写入向量记忆库（mem0）。
# 对话进程关闭时，缓存中所有事件自动刷入 mem0。

[memory_events]
# 是否启用事件式记忆。
# 类型: bool (true/false)
enabled = true

# 事件总结周期（每 N 轮对话总结一次）。
# 类型: int
# 提取的事件先在 pending_events 中积累，每 N 轮进行去重合并、
# 判断哪些事件已过时（写入 mem0）、哪些仍需缓存。
# 推荐范围: 2 ~ 5。
eval_interval = 2

# 事件提取和总结使用的模型。留空则使用 llm_model。
# 类型: string
eval_model = ""

# ===========================================================================
# 内在叙事流 — 自我表达连续性
# ===========================================================================
# 由 LLM 维护一段自然语言内在连续性，用于让角色在对话中保留自己的
# 注意、判断、表达惯性和话题耐心。程序只读写和注入文本，不解析为规则。

[inner_stream]
# 是否启用内在叙事流。
# 类型: bool
enabled = true

# 更新内在叙事流使用的模型。留空则使用 llm_model。
# 类型: string
model = ""

# 保存并注入的最大字符数。
# 类型: int
max_chars = 1200

# 单次更新最大生成 token。
# 类型: int
max_tokens = 700

# 内在叙事流更新日志。用于观察每次思考的触发、输入和更新结果。
# 类型: bool
log_updates = true

# 外部/自身事件进入后，最早提前到多少秒后更新内在叙事流。
# 类型: float
event_wakeup_delay_seconds = 0.5

# 没有强输入时，内在叙事流自己的基础更新周期。
# 类型: float
idle_interval_seconds = 5.0

# 长时间没有事件时，注入低频 time_tick 的周期。0 表示禁用。
# 类型: float
time_tick_interval_seconds = 10.0

# 单次节奏更新最多合并的事件数。
# 类型: int
event_max_batch = 16

# 注入内在叙事流 prompt 的事件文本最大字符数。
# 类型: int
event_prompt_max_chars = 3200

# 高频心跳更新时注入内在叙事流 prompt 的事件文本最大字符数。
# 类型: int
tick_prompt_max_chars = 1200

# ===========================================================================
# 内在叙事流主动搜索
# ===========================================================================
# 内在叙事流更新后，由 LLM 判断角色是否自然地产生了搜索冲动。
# 搜索结果会作为外部信息输入反馈回内在叙事流。

[inner_stream_search]
# 是否启用内在叙事流主动搜索。
# 类型: bool
enabled = true

# open-webSearch 本地 daemon 地址。
# 类型: string
base_url = "http://127.0.0.1:58902"

# 搜索冲动判断使用的模型。留空则使用 llm_model。
# 类型: string
model = ""

# 单次搜索返回结果数。
# 类型: int
max_results = 5

# 搜索事件写回内在叙事流的最大字符数。
# 类型: int
max_event_chars = 6000

# 搜索冲动判断的最小间隔。避免高频心跳每次都重复问搜索。
# 类型: float
consider_interval_seconds = 5.0

# daemon 请求超时。
# 类型: float
timeout = 45.0

# ===========================================================================
# 内在叙事流记忆反思
# ===========================================================================
# 内在叙事流更新后，由 LLM 判断最近输入/自身行动是否形成了值得记住的
# 一整件经历。记忆以自然语言事件写入，不做人工索引。

[inner_memory]
# 是否启用内在叙事流参与的记忆沉淀。
# 类型: bool
enabled = true

# 记忆反思使用的模型。留空则使用 llm_model。
# 类型: string
model = ""

# 单次反思最大生成 token。
# 类型: int
max_tokens = 512

# 记忆反思的最小间隔。高频心跳不应每次都触发重型记忆判断。
# 类型: float
consider_interval_seconds = 30.0

# 至少有多少个真实输入/自身行动事件时才触发记忆反思。
# 类型: int
min_events = 2

# ===========================================================================
# 内在叙事流认知反思
# ===========================================================================
# 内在叙事流更新后，把 QQ 群友、关系、长期对象等稳定印象沉淀到
# cognition.json。它不记录流水账，只维护可复用的长期认知。

[inner_cognition]
# 是否启用内在叙事流参与的认知沉淀。
# 类型: bool
enabled = true

# 认知反思最小间隔。避免每次心跳都触发 cognition 全量评估。
# 类型: float
consider_interval_seconds = 45.0

# 至少有多少个 QQ/搜索/图片/自身行动事件时才触发。
# 类型: int
min_events = 1

# 送入 cognition 评估的最近事件最大字符数。
# 类型: int
max_event_chars = 5000

# ===========================================================================
# QQ 环境输入
# ===========================================================================
# QQ 接入层只负责把群聊/私聊整理成环境输入，是否发言交给 LLM 结合
# 内在叙事流自主判断。旧的 qq_adapter.py 已弃用。

[qq]
# 是否让 cli.py 启动本地 QQ 输入 WebSocket server。
# 也可用 cli.py --qq 临时开启。
# 类型: bool
enabled = true

# qq_client.py 连接到 cli.py 的本地地址。
# 类型: string / int
alice_ws_url = "ws://127.0.0.1:58911"
alice_host = "127.0.0.1"
alice_port = 58911

# qq_client.py 直接连接 NapCat OneBot WebSocket 的默认地址。
# 类型: string
napcat_ws_url = "ws://127.0.0.1:3001"

# 旧桥接模式兼容地址。正常不需要启动 napcat_bridge.py。
# 类型: string
bridge_url = "ws://127.0.0.1:58888"

# 每个群/私聊保留的最近原始消息数。
# 类型: int
max_messages_per_conversation = 200

# 每次交给内在叙事/自主参与判断的最大消息行数。
# 类型: int
packet_max_lines = 40

# QQ 环境包只取最近多少秒内的消息；0 表示不按时间过滤。
# 类型: float
packet_max_age_seconds = 180.0

# 空闲社交探测只取最近多少秒内的消息；0 表示不按时间过滤。
# 类型: float
idle_packet_max_age_seconds = 90.0

# 消息停止多久后才把当前窗口合成一个环境包，避免每条消息都触发。
# 类型: float
batch_quiet_seconds = 1.0

# 每个环境包至少包含多少条新消息。
# 类型: int
batch_min_unread = 1

# 没有新 QQ 消息时，多久允许把最近会话作为空闲社交现场交给自主参与判断。
# 类型: float
idle_participation_seconds = 30.0

# 是否启用 QQ 自主参与判断。关闭后 QQ 只进入内在叙事，不主动发消息。
# 类型: bool
autonomous_participation_enabled = true

# QQ 自主参与判断前是否同步等待内在叙事流吸收本轮 QQ 环境。
# false 时 QQ 先快速决策，内在叙事流异步吸收，回复会更快。
# 类型: bool
absorb_before_decide = false

# QQ 自主参与判断模型。留空则使用 dialogue_model/llm_model。
# 类型: string
participation_model = "deepseek-v4-flash"

# 同一会话两次主动发言的最小间隔。只是外层防刷屏边界，不代表兴趣规则。
# 类型: float
participation_cooldown_seconds = 8.0

# QQ 单条发送内容最大字符数。
# 类型: int
max_message_chars = 260

[qq.image_understanding]
# 是否识别 QQ 收到的图片/表情包。
# 类型: bool
enabled = true

# 是否允许角色在喜欢某张表情包时自动收藏到本地表情包库。
# 类型: bool
auto_save_stickers = true

# 是否允许把截图收藏为表情包。默认关闭；截图仍会被识别并进入内在叙事流。
# 类型: bool
save_screenshots = false

# 是否允许把普通照片收藏为表情包。
# 类型: bool
save_photos = false

# 表情包库目录。
# 类型: string
sticker_dir = "data/stickers"

# 下载 QQ 图片的最大字节数。
# 类型: int
max_image_bytes = 8000000

# 图片下载超时。
# 类型: float
download_timeout = 15.0

# 图片理解超时。
# 类型: int
vision_timeout = 45

# 留空时复用全局 vision_backend / vision_model。
backend = ""
model = ""

# ===========================================================================
# 立绘覆盖层
# ===========================================================================
# 透明立绘窗口（PySide6），显示角色立绘表情。由 overlay_slideshow.py 实现。

# 立绘窗口 HTTP 控制服务地址。
portrait_overlay_host = "127.0.0.1"

# 立绘窗口 HTTP 控制服务端口。
# 类型: int
# 确保端口不被其他程序占用。
portrait_overlay_port = 17352

# 立绘决策循环间隔（秒）。
# 类型: float
# 0 = 使用后端默认值（约 2 秒）。
# 增大此值可减少 LLM 调用次数（立绘切换会变迟钝）。
# 减小此值让立绘表情更灵敏（但 LLM 调用更频繁）。
portrait_decision_interval = 0.0

# 对话结束后多少秒无语音，立绘自动恢复为平静表情。
# 类型: float
# 推荐范围: 30 ~ 120。太短会频繁跳回平静，太长会在不该平静时还保持表情。
portrait_decay_seconds = 60.0

# 立绘窗口上叠加显示调度状态调试信息。
# 类型: bool (true/false)
# 调试用。如果不需要看到驱动值数字可关闭。
portrait_debug_overlay = false

# 鼠标点击穿透立绘窗口。
# 类型: bool (true/false)
# true: 鼠标点击会穿过立绘窗口作用于下方窗口（适合游戏等交互场景）。
# false: 立绘窗口会拦截鼠标事件（可拖拽移动窗口）。
# 切换后需要重启立绘窗口生效。
portrait_click_through = false

# 立绘表情选择使用的模型。留空则使用对话 LLM。
# 类型: string
# 注意：如果有角色配置覆盖了 llm_model（如蓬莱用 charglm-4），
# 此处必须显式指定，避免回退到角色专用的对话模型。
portrait_model = "deepseek-v4-flash"

# ===========================================================================
# VTube Studio / Live2D
# ===========================================================================

[vts]
# 是否启用 VTube Studio 连接。
# 类型: bool
enabled = true

# VTube Studio Public API 地址。
host = "localhost"
port = 8001

[vts.body]
# 是否启用由内在状态驱动的 Live2D 脸部/身体脚本。
# 类型: bool
enabled = true

# 参数注入刷新率。越高动作越顺，通常 20-30 足够。
# 类型: float
update_hz = 30.0

# LLM 生成下一段身体表达脚本的最小间隔。
# 类型: float
intent_interval_seconds = 2.0

# 没有新表达脚本时，多久主动生成一次待机脚本。
# 类型: float
idle_request_seconds = 2.5

# 身体脚本生成模型。留空使用默认 LLM。
# 类型: string
model = "qwen2.5:1.5b"

# 是否记录 [vts_body] 脚本日志。
# 类型: bool
debug_log = true

# ===========================================================================
# 字幕覆盖层 — 流式显示 LLM 输出
# ===========================================================================
# 由 overlay_subtitle.py 实现。独立窗口，透明背景，白描深红字体，
# 可拖拽/缩放/折叠。开关与立绘绑定。

[subtitle]
# 字体颜色（CSS 颜色值）。
# 类型: string
# 例如 "#8b0000"（深红）、"#ffffff"（白色）、"#ff4444"（红色）
font_color = "#8b0000"

# 字体描边颜色（CSS 颜色值）。
# 类型: string
# 描边围绕字体边缘一圈，使文字更清晰易读。
stroke_color = "#ffffff"

# 字号（像素）。
# 类型: int
# 推荐范围: 18 ~ 48。
font_size = 30

# HTTP 控制服务地址和端口（与立绘独立）。
# 类型: string / int
# 确保端口不被其他程序占用。
subtitle_host = "127.0.0.1"
subtitle_port = 17353

# STT 字幕单独配置（独立端口，深蓝色描边）。
# 与 chat 字幕共用同一窗口程序，不同端口实现多实例。
[subtitle_stt]
# 字体颜色（CSS 颜色值）。
font_color = "#00008b"

# 字体描边颜色。
stroke_color = "#ffffff"

# 字号（像素）。
font_size = 30

# 折叠按钮颜色。
btn_color = "#4444ff"

# HTTP 控制服务端口（与 chat 字幕不同端口）。
subtitle_host = "127.0.0.1"
subtitle_port = 17354


# ===========================================================================
# 视觉 / 屏幕识别
# ===========================================================================

# 视觉后端选择。
# 类型: string
# 可选值:
#   "dashscope"   - 阿里云 DashScope（qwen-vl-plus 等），需要 API Key，识别能力强
#   "ollama"      - 本地 Ollama 多模态模型（如 llava），免费但识别能力较弱
vision_backend = "dashscope"

# 视觉模型名。
# 类型: string
# DashScope: "qwen-vl-plus"（推荐）, "qwen-vl-max"
# Ollama: "llava", "bakllava" 等本地已安装的多模态模型
vision_model = "qwen-vl-plus"

# DashScope API 密钥。
# 也可以通过环境变量 DASHSCOPE_API_KEY 设置（优先级更高）。
# 留空时从 config.json 的 vision_api_key 读取。
# 仅 vision_backend = "dashscope" 时需要。
vision_api_key = ""

# 截图缩放上限（像素总数）。超过此值会等比缩小。
# 类型: int。设为 0 禁用缩放，使用原始分辨率。
# 默认 921600 = 1280×720。减小可节省带宽和 visual token，增大可提升识别精细度。
vision_max_pixels = 921600


# ===========================================================================
# Edge 网页缓存 — 周期性读取当前 Edge 标签页正文
# ===========================================================================
# 由 cli.py 启动的后台线程，通过 Microsoft Edge DevTools Protocol
# 读取当前前台 Edge 网页的 document.body.innerText，并覆盖写入同一个缓存文件。
#
# 使用前需要用远程调试端口启动 Edge，例如：
# msedge.exe --remote-debugging-port=9222 --user-data-dir="%TEMP%\alice-edge-debug"

[edge_page_cache]
# 是否开启 Edge 网页正文缓存。
enabled = true

# 抓取间隔（秒）。
interval_seconds = 1.0

# Edge DevTools 地址。
devtools_host = "127.0.0.1"
devtools_port = 9222

# 缓存文件路径。相对路径基于项目根目录。
cache_file = "data/edge_page_cache.json"

# 最大保存字符数，防止超长网页撑爆上下文。
max_chars = 12000

# DevTools 请求超时（秒）。
request_timeout = 3.0


# ===========================================================================
# 屏幕监控 — 周期性截图 + 视觉分析
# ===========================================================================
# 由 cli.py 启动的后台线程，定时截图并通过视觉 API 分析内容，
# 判断是否有趣、是否隐私。结果作为主动对话候选缓存和对话历史注入。

[screen_watch]
# 是否开启持续屏幕截图分析。
enabled = false

# 截图分析的最小间隔（秒）。
# 类型: float
# 截图分析头尾相连不断执行：完成一次后立即开始下一次。
# watch_interval 是最小间隔：如果一次分析耗时少于这个值，则等待差值后再开始下一次。
# 如果分析耗时超过这个值，则不等待立即开始下一次。
# 太短：视觉 API 调用频繁（可能产生费用或负载）。
# 太长：缓存更新慢，AI 看到的屏幕内容可能过时。
# 推荐范围: 30 ~ 120。
watch_interval = 3.0

# 内容兴趣度最低分数（0-100）。
# 类型: float
# 视觉 API 对截图打分的兴趣度达到此值才会进入主动对话候选。
# 越高：只有非常有趣的内容才会成为候选。
# 越低：微小变化也可能触发（可能话多）。
# 推荐范围: 50 ~ 80。
interest_threshold = 70.0

# 单次视觉分析的最大超时（秒）。
# 类型: int
# 如果视觉 API 在超时内未返回，此次截图分析被跳过。
# DashScope 云端通常 10~30 秒，Ollama 本地可能更长。
vision_timeout = 45


# ===========================================================================
# 主动对话调度
# ===========================================================================
# 空闲时允许 DialogueOrchestrator 根据屏幕/网页缓存判断是否主动开口。
# 用户一旦开口说话，待执行的延迟对话计划会自动作废。

[proactive]
# 是否启用主动对话。
# 类型: bool (true/false)
enabled = true

# 主动/空闲调度使用的 planner 模型。留空则使用默认 LLM 模型。
# 类型: string
planning_model = ""

# ===========================================================================
# 主动对话记忆提示
# ===========================================================================
# 空闲时定期检查日期事件和长期记忆，作为候选上下文交给对话调度器。

[proactive_memory]

# 同一记忆事件的冷却时间（秒）。
# 类型: float
# 一条记忆事件触发后在此时间内不会再次触发。
# 默认 21600 秒 = 6 小时。
memory_cooldown_seconds = 21600.0  # 6 小时

# 日期匹配的记忆事件参考分数。
# 类型: float
memory_date_score = 50.0

# 定期记忆查询返回结果的参考分数。
# 类型: float
memory_lookup_score = 70.0

# 用于定期记忆查询的 LLM 提示语。
# 类型: string（英文，传给记忆后端的搜索查询）
# 预设查询会传入记忆后端进行语义搜索。
# 可修改为关注特定类型记忆，如 "user's hobbies, recent plans"
memory_lookup_query = "user's detailed preferences, specific life events, past conversations topics, hobbies, plans, opinions, personal experiences, goals, and important dates"
# 是否开启周期性记忆事件轮询。
# 类型: bool
# 独立于屏幕监控，另外开一个线程轮询记忆事件（纪念日匹配、定期记忆查询）。
memory_events_enabled = true

# 记忆事件轮询间隔（秒）。
# 类型: float
# 每 memory_check_interval 秒检查一次是否有记忆事件触发。
# 推荐范围: 120 ~ 600（2 分钟 ~ 10 分钟）。
memory_check_interval = 300.0

# 预约日期记忆事件示例（可按需添加更多）：
# 每个事件是一个 TOML 数组元素，结构固定：
#   date  - 月-日格式，每年匹配
#   label - 事件名称（显示和去重用）
#   note  - 给 LLM 的提醒（如何/何时提起）
# [[proactive_memory.memory_date_events]]
# date = "05-04"
# label = "Alice project anniversary"
# note = "Mention it only if the user seems idle and the mood is relaxed."

# ===========================================================================
# Bilibili 直播间弹幕 — 读取弹幕并回复
# ===========================================================================
# 由 bilibili_live.py 实现。后台线程维护 WebSocket 连接，
# 在空闲时根据弹幕内容触发角色主动对话。

[bilibili_live]
# 总开关。设为 false 时完全不连接 Bilibili。
# 类型: bool (true/false)
enabled = false

# 是否以直播场景理解弹幕/观众输入请使用 [scene].live_enabled。

# Bilibili 直播间房间号（URL 中的数字）。
# 例如 https://live.bilibili.com/7777 的房间号为 7777。
# 类型: int。设为 0 时禁用。
room_id = 1796292397

# 弹幕在缓冲区中的最长保留时间（秒）。
# 类型: float
# 超过此时间的弹幕会被自动丢弃，避免回复过时的弹幕。
# 推荐范围: 60 ~ 300。
buffer_max_age = 60.0

# WebSocket 连接失败后的重连等待时间（秒）。
# 类型: float
reconnect_delay = 5.0


# ===========================================================================
# mem0 — 内部记忆服务配置
# ===========================================================================
# 仅 memory_backend = "mem0" 时生效。
# mem0 管理对话记忆的存储、语义检索和生命周期。

[mem0.llm]
# mem0 用于记忆提取和摘要的 LLM 配置。
# 复用已有 LLM 服务，不需要单独部署。
provider = "ollama"
base_url = "http://127.0.0.1:11434"
# mem0 内部调用用的小模型。1.5b 足够，不需要大模型。
model = "qwen2.5:1.5b"

[mem0.embedder]
# 向量搜索用的嵌入模型配置。
# 使用 Ollama 本地嵌入模型，避免 fastembed 的 Hugging Face 下载链。
# 数据统一保存在项目根目录下的 mem0_data/ 中；不同嵌入模型使用不同子目录和 collection。
provider = "ollama"
# 本地 Ollama 地址。
base_url = "http://127.0.0.1:11434"
# 更偏中文/多语检索的 embedding 模型。
model = "bge-m3:latest"
# 嵌入向量的维度数，必须与模型匹配。
# bge-m3:latest -> 1024
embedding_dims = 1024

[mem0.lifecycle]
# 重要度模式。决定哪些对话值得存入长期记忆。
# 类型: string
# "auto"  - LLM 每次对话后判断是否重要（调用量较多但准确）。
# "always" - 所有对话都存入（记忆膨胀快，需要手动清理）。
importance_mode = "auto"
# 记忆召回的最小相似度阈值（0.0 ~ 1.0）。
# 类型: float
# 语义搜索时，相似度低于此值的记忆不被召回。
# 越高：召回的记忆越精准但可能漏掉相关记忆。
# 越低：召回更多但可能包含不相关的噪音。
# 推荐范围: 0.2 ~ 0.5。
search_threshold = 0.2
# 每次召回返回的最大记忆条数。
# 类型: int
# 召回的记忆会注入到对话上下文中，太多会让 LLM 分心。
# 推荐范围: 3 ~ 12。
search_top_k = 12

# ===========================================================================
# 工具调用 (Tool Calling / Function Calling)
# ===========================================================================
# 启用后，LLM 可以调用预定义的工具（如查看屏幕、搜索记忆等）。
# 工具调用采用 OpenAI 兼容的 function calling 格式。
# 关闭后使用旧版正则命令匹配（user_commands.py）。

[tool_calling]
# 总开关。设为 false 时使用旧版正则命令匹配。
# 类型: bool (true/false)
enabled = true

# 启用的工具列表。
# 类型: string 数组
# 可选: "look_at_screen", "search_memory", "get_current_time", "get_current_app",
#        "save_to_memory", "send_qq_message", "retire_sticker", "vts_expression", "vts_motion", "claude_code_exec",
#        "check_task_progress", "list_active_tasks", "cancel_task"
tools = [
  "look_at_screen",
  "search_memory",
  "get_current_time",
  "get_current_app",
  "save_to_memory",
  "send_qq_message",
  "retire_sticker",
  "vts_expression",
  "vts_motion",
  "claude_code_exec",
  "check_task_progress",
  "list_active_tasks",
  "cancel_task",
]

# 单次对话中工具调用的最大循环次数（防止死循环）。
# 类型: int。建议 3 ~ 8。
max_iterations = 5

# 单次工具调用超时（秒）。
# 类型: float
tool_timeout = 180.0


# ===========================================================================
# 智能体 (Agent) — Claude Code 外部工具
# ===========================================================================
# AI 角色可以通过 claude_code_exec 工具调用 Claude Code 来执行文件操作、
# 代码编写、文本处理等任务。任务在后台执行，AI 角色可以查询进度。

[agent]
# 总开关。设为 false 时禁用智能体调用。
# 类型: bool (true/false)
enabled = true

# Claude Code 可执行文件路径。留空则自动在 PATH 中查找。
# 类型: string（文件路径）
# 如果通过 npm 全局安装，一般会自动找到。
# Windows 常见路径: "C:/Users/<用户名>/AppData/Roaming/npm/claude"
# macOS/Linux: 通常已在 PATH 中
claude_code_path = ""

# 智能体任务超时（秒）。
# 类型: float
# 超过此时间未完成的任务将被强制终止。
timeout = 120.0

# 默认工作目录。留空使用项目根目录。
# 类型: string（目录路径）
working_dir = ""
