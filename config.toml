# Alice Chat 框架配置文件
# 真实的 API 密钥不要提交到 git。空密钥会禁用对应的云功能。
#
# 本文件所有可配置项均已列出。注释中标注了类型、取值范围、效果说明。
# config.toml 的值优先级高于 config.json。config.json 只填充本文件中为空/缺失的项。

# ===========================================================================
# LLM 路由
# ===========================================================================

# LLM 服务地址（兼容 OpenAI / Ollama 格式）。
# 类型: string (URL)
# Ollama 默认: http://127.0.0.1:11434
# OpenAI 兼容服务: http://127.0.0.1:8000/v1（程序会自动补 /v1）
# DeepSeek 等云端 API 不需要在此填地址，由模型名自动路由。
llm_url = "http://127.0.0.1:11434"

# 默认对话模型名称。
# 类型: string（模型名）
# 使用 Ollama: "qwen2.5:7b", "deepseek-v4-flash" 等
# 使用 OpenAI 兼容服务: 按服务支持的模型名填写
# 使用 DeepSeek: 模型名以 "deepseek" 开头时自动走 DeepSeek API
# 可通过启动参数 --model 临时覆盖。
llm_model = "deepseek-v4-flash"

# 可用模型列表，供 WebUI 下拉选择或启动时回退。
# 类型: string 数组
available_models = [
  "qwen2.5:0.5b",
  "qwen2.5:1.5b",
  "qwen2.5:7b",
  "deepseek-v4-flash",
  "deepseek-v4-pro",
]

# DeepSeek API 密钥。模型名以 deepseek 开头时自动使用 DeepSeek 云端 API。
# 也可以通过环境变量 DEEPSEEK_API_KEY 设置（环境变量优先级更高）。
# 留空时从 config.json 的 deepseek_api_key 读取。
# 类型: string
deepseek_api_key = ""

# 本地 transformers 模型名，作为 LLM 不可用时的后备。
# 仅在 local_llm.py 中使用，直接加载 HuggingFace 模型到内存。
# 类型: string（HuggingFace 模型 ID）
local_model = "Qwen/Qwen2.5-1.5B-Instruct"

# ===========================================================================
# TTS — 文本转语音
# ===========================================================================

# TTS 后端选择。
# 类型: string
# 可选值: "minimax"（推荐，低延迟流式）, "cartesia"
# 切换后端后会自动加载 kokoro/tts_{后端名}.py。
tts_backend = "minimax"

# ── Cartesia 配置 ──
# Cartesia 海外 TTS 服务。需要海外网络访问和有效 API Key。
cartesia_api_key = ""
# Cartesia 语音 ID。可在 Cartesia 控制台获取。
tts_voice_id = ""
# Cartesia TTS 音频采样率（Hz）。
# 类型: int（可选 8000, 16000, 22050, 24000, 44100, 48000）
# 越高音质越好，但数据量也越大。建议 24000。
tts_sample_rate = 24000

# ── MiniMax 配置 ──
# MiniMax TTS 服务。国内可用，WebSocket 流式合成，延迟低。
minimax_api_key = ""
# MiniMax 语音模型名。
# 类型: string
# 可选: "speech-2.8-turbo"（推荐，快速）, "speech-2.8-pro"（高质量）
minimax_model = "speech-2.8-turbo"
# MiniMax TTS 音频采样率（Hz）。
# 类型: int，可选 8000/16000/22050/24000/32000/44100/48000
minimax_sample_rate = 32000
# 语速倍率。
# 类型: float
# 1.0 = 正常语速，>1 加快（最大约 2.0），<1 减慢（最小约 0.5）。
# 推荐范围: 0.9 ~ 1.2。
minimax_tts_speed = 1.05
# 播放前预缓冲的音频秒数。
# 类型: float
# 值越大播放越流畅（减少卡顿），但首音延迟越高。
# 敏感场景（需要快速响应）设 0.05 ~ 0.15，流畅优先设 0.3 ~ 0.5。
minimax_tts_buffer_seconds = 0.3
# LLM 流式输出累积多少字符后强制刷新 TTS 缓冲区。
# 类型: int
# 较小值让 TTS 更快开始说话（但可能断句不自然），较大值等待更完整句子。
# 推荐范围: 20 ~ 40。
tts_stream_chunk_chars = 28
# TTS 流式输出时，触发句子刷新的最小字符数（需配合句末标点）。
# 类型: int
# 低于此长度的句子即使有句末标点也不刷新，避免吐出过短的碎片。
# 推荐范围: 6 ~ 12。
tts_stream_sentence_min_chars = 8

# ===========================================================================
# STT — 语音转文字
# ===========================================================================

# 流式 ASR 模型的存放目录。
# 类型: string（目录路径）
# 程序首次运行会自动下载模型到此目录。
stt_model_dir = "models/stt"

# 用于精炼 STT 原始识别结果的小模型。
# 类型: string（模型名）
# STT 输出碎片化短文本，此模型负责修正同音错字和去除口吃重复。
# 模型越强精炼效果越好，但延迟也越高。建议 1.5b ~ 7b。
# 设为 "" 可跳过精炼（直接使用原始 STT 结果）。
stt_refine_model = "qwen2.5:1.5b"

# STT 精炼模式。
# 类型: string
# 可选值:
#   "separate" - 独立精炼 LLM 调用（默认，当前行为），精炼完再聊天
#   "inline"   - 本地正则预清洗 + 聊天 LLM 隐式纠错，一次调用完成
#   "none"     - 仅本地正则预清洗，不调用任何 LLM 精炼
# separate 质量最高但延迟最大（精炼 LLM 串行阻塞）。
# inline 延迟最低，聊天 LLM 在回复时自然纠正少量同音错字。
# none 零 LLM 开销，适合 STT 准确率已经很高的场景。
stt_refine_mode = "inline"

# STT 文本稳定判定间隔（秒）。
# 类型: float
# 收到最后一段 STT 片段的静默时长超过此值后，触发精炼和推送。
# 太短：用户话没说完就推送，对话不完整。
# 太长：响应迟钝，需要等待更久。
# 根据用户说话习惯调整。一般 1.0 ~ 2.0 秒。
stt_refine_stable_seconds = 1.0

# 对话池轮询间隔（秒）。
# 类型: float
# 后台线程检查是否有稳定文本的频率。越小越及时，但 CPU 开销略高。
# 建议保持 0.05（50ms），不需要改动。
stt_pool_tick_seconds = 0.05

# STT 精炼 LLM 调用的最大 token 数。
# 类型: int
# 限制精炼模型的输出长度，防止胡言乱语消耗过多算力。
# STT 原文通常很短，64 ~ 128 足够。
stt_refine_max_tokens = 128

# 是否跳过短文本的精炼。
# 类型: bool (true/false)
# true: 短文本（长度 ≤ stt_skip_short_refine_max_chars）且无明显 ASR 异常时不调 LLM 精炼。
# false: 所有文本都走精炼。
# 开启可减少 LLM 调用次数和延迟，适合短文本较多的场景。
stt_skip_short_refine = true

# 跳过精炼的最大字符数（仅 stt_skip_short_refine = true 时生效）。
# 类型: int
# 超过此长度的文本即使无异常也会走 LLM 精炼。
stt_skip_short_refine_max_chars = 18

# TTS 播放期间暂停麦克风输入。
# 类型: bool (true/false)
# true: TTS 播放时关闭麦克风输入，防止扬声器声音被麦克风捕获造成回声/混乱。
# false: 不暂停，TTS 和 STT 同时运行（需要物理回声消除硬件）。
# 纯文字聊天场景此配置无效。
stt_pause_during_tts = true

# ===========================================================================
# 记忆后端
# ===========================================================================

# 记忆后端类型。
# 类型: string
# 可选值:
#   "none"        - 禁用记忆功能
#   "mem0"        - 本地向量记忆库（使用 mem0 + fastembed + Qdrant，完全本地运行）
#   "kokoromemo"  - 外部 KokoroMemo 记忆服务（需要单独启动 kokoromemo 服务）
memory_backend = "mem0"

# KokoroMemo 外部记忆服务地址和仓库路径。
# 仅 memory_backend = "kokoromemo" 时需要。
kokoromo_url = "http://127.0.0.1:14514"
kokoromo_dir = "D:/program/kokoromemo"

# ===========================================================================
# 立绘覆盖层
# ===========================================================================
# 透明立绘窗口（PySide6），显示角色立绘表情。由 overlay_slideshow.py 实现。

# 立绘窗口 HTTP 控制服务地址。
portrait_overlay_host = "127.0.0.1"

# 立绘窗口 HTTP 控制服务端口。
# 类型: int
# 确保端口不被其他程序占用。
portrait_overlay_port = 17352

# 立绘决策循环间隔（秒）。
# 类型: float
# 0 = 使用后端默认值（约 2 秒）。
# 增大此值可减少 LLM 调用次数（立绘切换会变迟钝）。
# 减小此值让立绘表情更灵敏（但 LLM 调用更频繁）。
portrait_decision_interval = 0.0

# 对话结束后多少秒无语音，立绘自动恢复为平静表情。
# 类型: float
# 推荐范围: 30 ~ 120。太短会频繁跳回平静，太长会在不该平静时还保持表情。
portrait_decay_seconds = 60.0

# 立绘窗口上叠加显示调度器的冲动值调试信息。
# 类型: bool (true/false)
# 调试用。如果不需要看到驱动值数字可关闭。
portrait_debug_overlay = true

# 鼠标点击穿透立绘窗口。
# 类型: bool (true/false)
# true: 鼠标点击会穿过立绘窗口作用于下方窗口（适合游戏等交互场景）。
# false: 立绘窗口会拦截鼠标事件（可拖拽移动窗口）。
# 切换后需要重启立绘窗口生效。
portrait_click_through = false

# ===========================================================================
# 视觉 / 屏幕识别
# ===========================================================================

# 视觉后端选择。
# 类型: string
# 可选值:
#   "dashscope"   - 阿里云 DashScope（qwen-vl-plus 等），需要 API Key，识别能力强
#   "ollama"      - 本地 Ollama 多模态模型（如 llava），免费但识别能力较弱
vision_backend = "dashscope"

# 视觉模型名。
# 类型: string
# DashScope: "qwen-vl-plus"（推荐）, "qwen-vl-max"
# Ollama: "llava", "bakllava" 等本地已安装的多模态模型
vision_model = "qwen-vl-plus"

# DashScope API 密钥。
# 也可以通过环境变量 DASHSCOPE_API_KEY 设置（优先级更高）。
# 留空时从 config.json 的 vision_api_key 读取。
# 仅 vision_backend = "dashscope" 时需要。
vision_api_key = ""

# ===========================================================================
# 主动语音调度器
# ===========================================================================
# 调度器通过冲动值积累机制让角色在空闲时主动说话。
# 基于四种行为（IDLE/RECENT/MEM/SCREEN）各自的冲动值、用户沉默时长、
# 最近对话、记忆事件、屏幕内容等因素综合决策。
#
# 冲动值概念：每种行为有独立冲动值（0 ~ 100+），
#   达到 active_threshold 后才可能触发，触发后归零重新积累。
# 干扰值概念：用户活跃度越高干扰值越大，超过 max_disturbance 的行为被过滤。
# 多样性窗口：同一类行为触发后需等待 diversity_window_seconds 后才能再次触发。

[proactive]
# 所有主动行为的总开关。
# 类型: bool (true/false)
# 设为 false 完全禁用主动搭话。也可通过 --no-proactive 启动参数临时禁用。
enabled = true

# 调度器 tick 间隔（秒）。
# 类型: float
# 主循环每 tick_seconds 秒检查一次是否需要触发主动搭话。
# 越小响应越快，但 CPU 开销略高。推荐 2.0 ~ 5.0。
tick_seconds = 3.0

# 所有冲动值累积/衰减速率的全局倍率。
# 类型: float
# 1.0 = 正常速率，4.0 = 所有速率乘以 4（主动频率翻倍）。
# 仅调整此值可整体控制主动发言的积极程度，无需逐项调整各行为的 rate。
drive_rate = 4.0

# 多样性窗口（秒）。
# 类型: float
# 在此时间内不会重复触发同一类行为。
# 例如 SCREEN 触发后 60 秒内不会再触发 SCREEN。
# 推荐范围: 30 ~ 120。
diversity_window_seconds = 60.0

# 备选行为挑选概率。
# 类型: float (0.0 ~ 1.0)
# 当冲动值最高的行为被多样性窗口过滤后，有 secondary_pick_chance 的概率
# 选择第二高的行为，否则本轮不触发任何行为。
# 0.0 = 从不选第二候选人，1.0 = 只要最高被过滤就一定选第二。
secondary_pick_chance = 0.2

# ── IDLE（空闲搭话） ──
# 用户长时间不说话时触发。被同类对话类的 AI 替代后默认关闭。
[proactive.idle]
# 该行为的总开关。
enabled = false
# IDLE 冲动值的每秒增长量（原始值，最终乘以 drive_rate）。
# 类型: float。越大空闲时越想搭话。
rate = 0.08
# 触发该行为所需的最小冲动值。
# 类型: float。推荐 50 ~ 80。
active_threshold = 60.0
# 行为触发后的冷却时间（秒）。冷却期间行为不参与选择。
cooldown_seconds = 30.0
# 因 TTS/STT 繁忙而被延期后扣除的冲动值。
# 类型: float。扣减后延迟下轮触发，避免立即重试。
defer_penalty = 20.0
# 该行为能承受的最大干扰值。
# 类型: float。用户越活跃干扰越大，超过此值的行为被过滤。
# 小值：只在用户完全安静时才触发。大值：用户有事做时也可能触发。
max_disturbance = 35.0
# 权重倍率。
# 类型: float。最终冲动值 = (积累值 + 注入值) * weight / sum(all_weights)
weight = 1.0
# 用户连续空闲多少秒后开始给予 IDLE 额外增速。
# 类型: float。越长给 IDLE 增加速率的门槛越高。
user_idle_bonus_after_seconds = 120.0

# ── RECENT（对话余韵） ──
# 对话刚结束后，趁热再补一句自然的延续。
[proactive.recent]
enabled = true
# RECENT 冲动值的每秒衰减速度（原始值，最终乘以 drive_rate）。
# 类型: float。越大衰减越快，错过时机就不会触发了。
decay_rate = 2.0
# 对话结束后多少秒 RECENT 冲动值才开始衰减。
# 类型: float。此时间内保持峰值，给对话留余温时间。
decay_delay_seconds = 30.0
# 触发阈值。
active_threshold = 70.0
cooldown_seconds = 30.0
defer_penalty = 20.0
max_disturbance = 45.0
weight = 1.0
# 对话结束后多少秒内，IDLE 行为获得额外增速（RECENT 热度的余波）。
bonus_window_seconds = 120.0

# ── MEM（记忆事件搭话） ──
# 基于长期记忆中的内容（纪念日、过往对话、定期查询结果）触发搭话。
[proactive.mem]
enabled = true
# MEM 冲动值（由 memory_events 事件注入）的每秒增长量。
rate = 0.1
active_threshold = 70.0
cooldown_seconds = 30.0
defer_penalty = 20.0
# 记忆事件对干扰敏感，用户正忙时不要提记忆话题。
max_disturbance = 25.0
weight = 1.0

# ── SCREEN（屏幕搭话） ──
# 屏幕监控发现有趣内容时，对用户当前操作进行评论/提问。
[proactive.screen]
enabled = true
# SCREEN 冲动值的每秒衰减速度（原始值，最终乘以 drive_rate）。
# 屏幕兴趣是瞬时的，衰减越快，错过窗口就不评论了。
decay_rate = 5.0
active_threshold = 70.0
cooldown_seconds = 30.0
defer_penalty = 20.0
# 屏幕搭话可以容忍较高的干扰值——用户在操作屏幕本身就是一种背景。
max_disturbance = 50.0
weight = 1.0
# 对话结束后扣除的 SCREEN 冲动值，避免正常对话过程中突然插话评论屏幕。
post_conversation_decay = 30.0

# ===========================================================================
# 屏幕监控 — 周期性截图 + 视觉分析
# ===========================================================================
# 由 cli.py 启动的后台线程，定时截图并通过视觉 API 分析内容，
# 判断是否有趣、是否隐私。结果用于 SCREEN 主动搭话和对话历史注入。

[screen_watch]
# 是否开启周期性屏幕截图分析。
enabled = true

# 截图/分析周期（秒）。
# 类型: float
# 每 watch_interval 秒截图一次并调用视觉 API 分析。
# 太短：视觉 API 调用频繁（可能产生费用或负载），且内容变化不大。
# 太长：可能错过用户的活动变化。
# 推荐范围: 30 ~ 120。
watch_interval = 45.0

# 内容兴趣度最低分数（0-100）。
# 类型: float
# 视觉 API 对截图打分的兴趣度达到此值才触发 SCREEN 冲动值增加。
# 越高：只有非常有趣的内容才会触发搭话。
# 越低：微小变化也可能触发（可能话多）。
# 推荐范围: 50 ~ 80。
interest_threshold = 70.0

# 单次视觉分析的最大超时（秒）。
# 类型: int
# 如果视觉 API 在超时内未返回，此次截图分析被跳过。
# DashScope 云端通常 10~30 秒，Ollama 本地可能更长。
vision_timeout = 45

# 是否开启周期性记忆事件轮询。
# 类型: bool
# 独立于屏幕监控，另外开一个线程轮询记忆事件（纪念日匹配、定期记忆查询）。
memory_events_enabled = true

# 记忆事件轮询间隔（秒）。
# 类型: float
# 每 memory_check_interval 秒检查一次是否有记忆事件触发。
# 推荐范围: 120 ~ 600（2 分钟 ~ 10 分钟）。
memory_check_interval = 300.0

# 同一记忆事件的冷却时间（秒）。
# 类型: float
# 一条记忆事件触发后在此时间内不会再次触发。
# 默认 21600 秒 = 6 小时。
memory_cooldown_seconds = 21600.0  # 6 小时

# 日期匹配的记忆事件触发后注入的基础冲动值。
# 类型: float
# 值越高，日期纪念日越容易触发主动搭话。
memory_date_score = 50.0

# 定期记忆查询返回结果时注入的基础冲动值。
# 类型: float
# 值越高，定期记忆查询结果越容易触发主动搭话。
memory_lookup_score = 70.0

# 用于定期记忆查询的 LLM 提示语。
# 类型: string（英文，传给记忆后端的搜索查询）
# 预设查询会传入记忆后端进行语义搜索。
# 可修改为关注特定类型记忆，如 "user's hobbies, recent plans"
memory_lookup_query = "recent important user preferences, plans, dates, anniversaries, goals"

# 预约日期记忆事件示例（可按需添加更多）：
# 每个事件是一个 TOML 数组元素，结构固定：
#   date  - 月-日格式，每年匹配
#   label - 事件名称（显示和去重用）
#   note  - 给 LLM 的提醒（如何/何时提起）
# [[proactive.memory_date_events]]
