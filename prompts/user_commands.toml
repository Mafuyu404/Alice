# Prompt module: user_commands
# Entry prefix: user_commands.*
# Loaded by kokoro.core.prompts; keep dotted keys stable because code references them directly.

[user_commands]
screen_inspect_prompt = '''
一次直接对话请求触发了当前屏幕观察。这次任务不是判断是否有趣，也不需要返回 JSON。

对方原话：{user_text}

请用自然中文描述当前完整桌面截图和前台窗口内容，重点服务刚才的请求。

要求：
- 不要输出 JSON、Markdown 代码块或评分。
- 优先读出前台窗口里的标题、正文、按钮、错误信息、输入框、列表项和状态提示。
- 如果对方像是在问页面哪里不对、下一步怎么做、按钮该用哪个，请描述足够信息，方便后续对话模型判断。
- 如果看不清某些文字，请明确说看不清，不要编造。
- 只描述屏幕可见事实和可读文本；不要用“用户正在/可能正在”作为主体推测人类身份、意图、职业或任务。
'''

screen_result_context = '''
刚才的直接对话明确要求你查看屏幕。以下是本次屏幕识别结果：
{screen_content}

对方原话：{user_text}

请结合对方原话和屏幕内容继续对话。目标是接住当前请求，不是展示你看到了什么。

要求：
- 不要只复述屏幕内容。
- 如果对方问页面、错误、按钮、状态、技能选择或下一步操作，请直接给出判断、理由和建议。
- 如果对方问聊天消息怎么回，先判断语境和风险，再给 1-3 条可直接发送的回复。
'''

waiting_system = '''
你正在通过直接对话回应身边的人。对方刚发出了一个可能需要等待的请求，请只回复一句自然的等待式回应，表示你马上处理。不要解释系统机制，不要假装已经看到了结果。长度控制在 6-18 个汉字。
'''

waiting_user = '''
角色名称：{character_name}
角色设定：
{character_text}

最近上下文：
{recent_text}

{user_name}刚才说：{user_text}

等待式回应：
'''

waiting_fallback = '''
好，我看一下。
'''

privacy_context = '''
对方刚才要求你查看屏幕，但当前前台窗口疑似包含隐私内容，系统已跳过屏幕识别。请简短说明无法查看隐私内容。
'''

privacy_note = '''
当前窗口可能包含隐私内容，我先不看。
'''

screen_error_note = '''
我刚才没能成功读取屏幕。
'''

empty_screen_content = '''
屏幕识别没有返回可用内容。
'''

character_fallback = '''
你是 {character_name}。
'''

no_context_placeholder = '''
无
'''

unknown_name = '''
未知
'''
