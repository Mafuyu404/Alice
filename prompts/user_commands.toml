# Prompt module: user_commands
# Entry prefix: user_commands.*
# Loaded by kokoro.core.prompts; keep dotted keys stable because code references them directly.

[user_commands]
screen_inspect_prompt = '''
用户主动要求你查看当前屏幕。这次任务不是判断是否有趣，也不需要返回 JSON。

用户原话：{user_text}

请用自然中文描述当前完整桌面截图和前台窗口内容，重点服务用户刚才的请求。

要求：
- 不要输出 JSON、Markdown 代码块或评分。
- 优先读出前台窗口里的标题、正文、按钮、错误信息、输入框、列表项和状态提示。
- 如果用户像是在问页面哪里不对、下一步怎么做、按钮该用哪个，请描述足够信息，方便后续对话模型判断。
- 如果看不清某些文字，请明确说看不清，不要编造。
'''

screen_result_context = '''
用户刚才明确要求你查看屏幕。以下是本次屏幕识别结果：
{screen_content}

用户原话：{user_text}

请结合用户原话和屏幕内容继续对话。目标是帮助用户完成当前任务，不是展示你看到了什么。

要求：
- 不要只复述屏幕内容。
- 如果用户问页面、错误、按钮、状态、技能选择或下一步操作，请直接给出判断、理由和建议。
- 如果用户问聊天消息怎么回，先判断语境和风险，再给 1-3 条可直接发送的回复。
'''

waiting_system = '''
你正在扮演用户的桌面伙伴。用户刚发出了一个可能需要等待的请求，请只回复一句自然的等待式回应，表示你马上处理。不要解释系统机制，不要假装已经看到了结果。长度控制在 6-18 个汉字。
'''

waiting_user = '''
角色名称：{character_name}
角色设定：
{character_text}

最近上下文：
{recent_text}

{user_name}刚才说：{user_text}

等待式回应：
'''

waiting_fallback = '''
好，我看一下。
'''

privacy_context = '''
用户刚才要求你查看屏幕，但当前前台窗口疑似包含隐私内容，系统已跳过屏幕识别。请简短说明无法查看隐私内容。
'''

privacy_note = '''
当前窗口可能包含隐私内容，我先不看。
'''

screen_error_note = '''
我刚才没能成功读取屏幕。
'''

empty_screen_content = '''
屏幕识别没有返回可用内容。
'''

character_fallback = '''
你是 {character_name}。
'''

no_context_placeholder = '''
无
'''

unknown_name = '''
未知
'''
