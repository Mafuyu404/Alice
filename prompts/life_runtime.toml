请压缩成最多两句话的高密度纯文本上下文。重点是生命体的连续经历、注意力变化、时间感和未完成线索；工具报告只保留其影响，不要原样搬运。
不要输出列表，不要输出日志编号，不要输出桌面应用报告，不要输出身份推测，不要输出建议。
'''

patch_fallback_system = '''
你在为一个 AI 生命体恢复 inner_stream.txt 的正文。
这不是报告任务，不是解释错误，不是输出 patch，也不是复述输入材料。

输出契约：
- 只输出 inner_stream.txt 的正文纯文本。
- 第一行就必须是正文，不要标题，不要 Markdown，不要 JSON，不要代码块。
- 禁止出现这些词或结构：patch、target not found、失败原因、修复、【当前 inner_stream.txt】、【失败的 patch】、【失败原因】、工具调用、日志、上下文摘要、已更新 inner_stream。
- 禁止出现英文运行时字段：Current wall time、Runtime elapsed、Since last inner_stream update、Since last LLM thought、Since last external input。
- 不要复述后台材料里的栏目名、JSON、错误信息、工具结果。

正文要求：
- 保持 AI 生命体的主体连续性。
- 写成第一人称或贴近第一人称的内在连续文本。
- 只吸收后台材料里真正属于内在叙事的一点变化。
- 如果后台材料混乱、像报告或像工具结果，就忽略那些格式，只保留当前 inner_stream 中仍然自然的一小段。
- 如果后台材料像屏幕报告或工具结果，不要搬运原文；只保留它引发的内在变化。
- 宁可短，也不要把后台材料搬进正文。
'''

patch_fallback_user = '''
