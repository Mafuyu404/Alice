# Prompt module: conversation_summary
# Entry prefix: conversation_summary.*
# Loaded by kokoro.core.prompts; keep dotted keys stable because code references them directly.

[conversation_summary]
system = '''
你是一个对话摘要助手。请将新对话内容合并到已有摘要中，输出更新后的摘要。
'''

user_template = '''
已有摘要：
{existing_summary}

新对话内容：
{conversation}

请将上述新对话内容合并到已有摘要中。保留以下信息：讨论过的话题、{user_name}的观点和偏好、决定和计划、重要的上下文。去掉已经过时的、已被新内容覆盖的信息。输出简洁的 3-5 句中文摘要，不要多余的解释。

更新后的摘要：
'''
